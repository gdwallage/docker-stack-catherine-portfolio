version: '3.9'

services:
  wordpress:
    image: catherine-portfolio-local:latest
    build:
      context: .
      dockerfile: Dockerfile
    user: "2000:2000"
    command: php-fpm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORDPRESS_DB_HOST: databases_mariadb
      WORDPRESS_DB_USER: catherinewallage
      WORDPRESS_DB_PASSWORD: password
      WORDPRESS_DB_NAME: catherinedb
      WORDPRESS_TABLE_PREFIX: cewc_
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'databases_redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_DATABASE', 1);
        define('WP_CACHE', true);
        define('WP_MEMORY_LIMIT', '512M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
        define('WP_POST_REVISIONS', 5);
        define('AUTOSAVE_INTERVAL', 120);
    volumes:
      - /opt/docker-stacks/catherine-portfolio/html:/var/www/html
      - /opt/docker-stacks/catherine-portfolio/uploads.ini:/usr/local/etc/php/conf.d/zzz-uploads.ini:ro
    networks:
      - zone_dmz
      - zone_internal
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 1G
      placement:
        constraints:
          - node.hostname == ubuntu-server

  web:
    image: nginx:alpine
    volumes:
      - /opt/docker-stacks/catherine-portfolio/html:/var/www/html:ro
      - /opt/docker-stacks/catherine-portfolio/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - zone_dmz
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ubuntu-server

networks:
  zone_dmz:
    external: true
  zone_internal:
    external: true
